version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: joineazy_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: joineazy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d joineazy"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: joineazy_backend
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@db:5432/joineazy
      JWT_SECRET: super-secure-jwt-secret-key-joineazy-internship-2026
      JWT_EXPIRES_IN: 7d
      ADMIN_INVITE_CODE: joineazy-prof-2026
      CORS_ORIGIN: http://localhost:5173
      NODE_ENV: production
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    container_name: joineazy_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
